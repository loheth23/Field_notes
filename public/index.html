<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Field Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--canvas:#3E4632;--canvas-ink:#EFEADA;--paper:#F3EEDF;--paper-alt:#ECE5D0;--ink:#262A1F;--ink-soft:#5A5F4E;--thread:#A8402F;--thread-soft:#C97C5D;--line:rgba(38,42,31,.14);--shadow:rgba(30,28,18,.22);--radius:3px;box-sizing:border-box}*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}body{min-height:100vh}.cover{background:var(--canvas);color:var(--canvas-ink);padding:28px 24px 22px;position:sticky;top:0;z-index:10;border-bottom:3px double var(--thread-soft)}.cover-inner{max-width:760px;margin:0 auto}.wordmark{font-family:Fraunces,serif;font-size:clamp(28px,5vw,38px);font-weight:500;letter-spacing:-.01em;margin:0 0 4px}.tagline{margin:0 0 18px;color:var(--canvas-ink);opacity:.65;font-size:13.5px;max-width:46ch}.capture{background:var(--paper);color:var(--ink);border-radius:var(--radius);box-shadow:0 8px 20px var(--shadow);padding:14px 16px 12px}.capture textarea{width:100%;border:none;background:transparent;resize:none;font-family:inherit;font-size:15px;color:var(--ink);min-height:46px;outline:none;line-height:1.5}.capture textarea::placeholder{color:var(--ink-soft)}.capture-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;padding-top:10px;border-top:1px solid var(--line)}.capture-tools{display:flex;gap:6px;align-items:center}.tool-btn,.filter-row button{background:none;border:1px solid var(--line);border-radius:var(--radius);font-family:inherit;cursor:pointer}.tool-btn{padding:6px 10px;font-size:12.5px;color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px}.tool-btn:hover{color:var(--ink);border-color:var(--ink-soft)}.save-btn{background:var(--thread);color:#fdf6ee;border:none;border-radius:var(--radius);padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}.save-btn:disabled{opacity:.35;cursor:default}.save-btn:not(:disabled):hover{background:var(--thread-soft)}.img-preview{margin-top:8px;position:relative;display:inline-block}.img-preview img{max-height:120px;border-radius:var(--radius);display:block;border:1px solid var(--line)}.img-preview button{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;border:none;background:var(--ink);color:var(--paper);cursor:pointer;font-size:12px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.user-label{font-size:13px;color:var(--canvas-ink);opacity:.8}.account-actions{display:flex;gap:8px;align-items:center}.delete-account-btn{background:none;border:1px solid rgba(239,234,218,.35);color:var(--canvas-ink);border-radius:var(--radius);padding:6px 10px;cursor:pointer;font:inherit;font-size:12px}.delete-account-btn:hover{border-color:var(--thread-soft);color:var(--thread-soft)}.logout-btn{background:none;border:1px solid rgba(239,234,218,.35);color:var(--canvas-ink);border-radius:var(--radius);padding:6px 10px;cursor:pointer;font:inherit;font-size:12px}.main{max-width:760px;margin:0 auto;padding:22px 24px 60px}.filter-row{display:flex;gap:8px;margin:4px 0 22px;font-size:13px}.filter-row button{color:var(--ink-soft);padding:5px 12px;border-radius:20px}.filter-row button.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}.board{columns:2 260px;column-gap:16px}@media(max-width:480px){.board{columns:1}}.clip{break-inside:avoid;margin-bottom:16px;background:var(--paper-alt);border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 12px;position:relative;box-shadow:0 3px 8px var(--shadow)}.clip:before{content:'';position:absolute;top:-6px;left:18px;width:10px;height:10px;border-radius:50%;background:var(--thread);box-shadow:0 1px 2px var(--shadow)}.clip:nth-child(3n+1){transform:rotate(-.6deg)}.clip:nth-child(3n+2){transform:rotate(.5deg)}.clip:nth-child(3n){transform:rotate(-.2deg)}.clip img{width:100%;border-radius:2px;display:block;margin-bottom:8px;cursor:zoom-in}.clip p{margin:0;font-size:14.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}.clip-meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:11px;color:var(--ink-soft)}.clip-del{background:none;border:none;color:var(--ink-soft);cursor:pointer;font:inherit;font-size:11px;padding:0}.clip-del:hover{color:var(--thread)}.empty{text-align:center;padding:60px 20px;color:var(--ink-soft)}.empty .wordmark-sm{font-family:Fraunces,serif;font-size:20px;color:var(--ink);margin-bottom:6px}.lightbox{position:fixed;inset:0;background:rgba(20,20,14,.86);display:none;align-items:center;justify-content:center;padding:24px;z-index:50}.lightbox.open{display:flex}.lightbox img{max-width:100%;max-height:100%;border-radius:4px}
.auth{min-height:100vh;background:var(--canvas);color:var(--canvas-ink);display:flex;align-items:center;justify-content:center;padding:24px}.auth-card{width:min(420px,100%);background:var(--paper);color:var(--ink);padding:30px;border-radius:var(--radius);box-shadow:0 14px 35px var(--shadow)}.auth-brand{font-family:Fraunces,serif;font-size:38px;margin:0 0 5px}.auth-sub{color:var(--ink-soft);font-size:13px;margin:0 0 24px}.auth-tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:20px}.auth-tab{flex:1;padding:10px;background:none;border:none;border-bottom:2px solid transparent;color:var(--ink-soft);font:inherit;cursor:pointer}.auth-tab.active{color:var(--ink);border-bottom-color:var(--thread)}.field{margin-bottom:14px}.field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px}.field input{width:100%;padding:11px 12px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:var(--radius);outline:none;font:inherit}.field input:focus{border-color:var(--thread)}.auth-submit{width:100%;padding:11px;border:0;border-radius:var(--radius);background:var(--thread);color:#fff;font:600 13px Inter;cursor:pointer}.auth-submit:hover{background:var(--thread-soft)}.auth-message{min-height:20px;margin:12px 0 0;font-size:12px;color:var(--thread)}.hidden{display:none!important}::selection{background:var(--thread-soft);color:#fff}
@media(prefers-color-scheme:dark){:root{--canvas:#232920;--canvas-ink:#E7E2D2;--paper:#2B2E24;--paper-alt:#32362A;--ink:#E7E2D2;--ink-soft:#A6A794;--thread:#D97F63;--thread-soft:#B85B44;--line:rgba(231,226,210,.14);--shadow:rgba(0,0,0,.45)}}
</style>
</head>
<body>
<section id="auth-view" class="auth">
  <div class="auth-card">
    <p class="auth-brand">Field Notes</p>
    <p class="auth-sub">A quiet space for text and pictures worth keeping.</p>
    <div class="auth-tabs"><button class="auth-tab active" data-mode="login">Log in</button><button class="auth-tab" data-mode="signup">Create account</button></div>
    <form id="auth-form">
      <div class="field"><label for="username">Username</label><input id="username" autocomplete="username" minlength="3" maxlength="32" required></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="4" required></div>
      <button class="auth-submit" id="auth-submit" type="submit">Log in</button>
      <p class="auth-message" id="auth-message"></p>
    </form>
  </div>
</section>

<section id="app-view" class="hidden">
<div class="cover"><div class="cover-inner">
  <div class="topbar"><span class="user-label" id="welcome"></span><div class="account-actions"><button class="delete-account-btn" id="delete-account" type="button">Delete account</button><button class="logout-btn" id="logout">Log out</button></div></div>
  <p class="wordmark">Field Notes</p>
  <p class="tagline">A pocket board for text and pictures worth keeping. Saved in your private server space.</p>
  <div class="capture">
    <textarea id="text-input" placeholder="Paste a thought, a quote, a link…" rows="1"></textarea>
    <div id="preview-wrap"></div>
    <div class="capture-row"><div class="capture-tools"><button class="tool-btn" id="img-btn" type="button">＋ Image</button><input type="file" id="file-input" accept="image/*" style="display:none"></div><button class="save-btn" id="save-btn" disabled>Pin it</button></div>
  </div>
</div></div>
<main class="main"><div class="filter-row" id="filter-row"><button data-filter="all" class="active">All</button><button data-filter="text">Text</button><button data-filter="image">Images</button></div><div class="board" id="board"></div><div class="empty" id="empty-state" style="display:none"><p class="wordmark-sm">Nothing pinned yet</p><p>Write a note above, or add an image, then hit Pin it.</p></div></main>
</section>
<div class="lightbox" id="lightbox"><img id="lightbox-img" src="" alt=""></div>
<script>
(() => {
const API='/api'; let mode='login', pendingImage=null, currentFilter='all', clips=[];
const $=id=>document.getElementById(id);
async function api(path, options={}){const r=await fetch(API+path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'Request failed');return d}
function showAuth(){ $('auth-view').classList.remove('hidden'); $('app-view').classList.add('hidden'); }
function showApp(username){ $('auth-view').classList.add('hidden'); $('app-view').classList.remove('hidden'); $('welcome').textContent=`Hello, ${username}`; loadClips(); }
$('auth-form').addEventListener('submit',async e=>{e.preventDefault();$('auth-submit').disabled=true;$('auth-message').textContent='';try{const d=await api(mode==='login'?'/login':'/signup',{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value})});showApp(d.username);$('auth-form').reset()}catch(err){$('auth-message').textContent=err.message}finally{$('auth-submit').disabled=false}});
document.querySelectorAll('.auth-tab').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;document.querySelectorAll('.auth-tab').forEach(x=>x.classList.toggle('active',x===b));$('auth-submit').textContent=mode==='login'?'Log in':'Create account';$('password').autocomplete=mode==='login'?'current-password':'new-password';$('auth-message').textContent=''}));
$('logout').addEventListener('click',async()=>{await api('/logout',{method:'POST'});clips=[];showAuth()});
$('delete-account').addEventListener('click',async()=>{
  const confirmed=confirm('Delete your account permanently? This will remove your account, all saved notes, and all uploaded images. This cannot be undone.');
  if(!confirmed)return;
  const second=confirm('Are you sure? Everything in this Field Notes account will be permanently deleted.');
  if(!second)return;
  const button=$('delete-account');
  button.disabled=true;
  button.textContent='Deleting…';
  try{
    await api('/delete-account',{method:'POST'});
    clips=[];
    pendingImage=null;
    fileInput.value='';
    renderPreview();
    showAuth();
    $('auth-message').textContent='Account deleted.';
  }catch(e){
    alert(e.message);
    button.disabled=false;
    button.textContent='Delete account';
  }
});
const textInput=$('text-input'),fileInput=$('file-input'),imgBtn=$('img-btn'),saveBtn=$('save-btn'),previewWrap=$('preview-wrap'),board=$('board'),emptyState=$('empty-state'),filterRow=$('filter-row'),lightbox=$('lightbox'),lightboxImg=$('lightbox-img');
function updateSave(){saveBtn.disabled=!(textInput.value.trim()||pendingImage)}
textInput.addEventListener('input',()=>{textInput.style.height='auto';textInput.style.height=textInput.scrollHeight+'px';updateSave()});
imgBtn.addEventListener('click',()=>fileInput.click());
fileInput.addEventListener('change',()=>{const f=fileInput.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{pendingImage=e.target.result;renderPreview();updateSave()};r.readAsDataURL(f)});
textInput.addEventListener('paste',e=>{for(const item of (e.clipboardData?.items||[])){if(item.type.startsWith('image')){const r=new FileReader();r.onload=x=>{pendingImage=x.target.result;renderPreview();updateSave()};r.readAsDataURL(item.getAsFile())}}});
function renderPreview(){if(!pendingImage){previewWrap.innerHTML='';return}previewWrap.innerHTML='';const w=document.createElement('div');w.className='img-preview';const i=document.createElement('img');i.src=pendingImage;const b=document.createElement('button');b.textContent='×';b.type='button';b.onclick=()=>{pendingImage=null;fileInput.value='';renderPreview();updateSave()};w.append(i,b);previewWrap.append(w)}
saveBtn.addEventListener('click',async()=>{const text=textInput.value.trim();if(!text&&!pendingImage)return;saveBtn.disabled=true;saveBtn.textContent='Pinning…';try{const c=await api('/clips',{method:'POST',body:JSON.stringify({text:text||null,image:pendingImage})});clips.unshift(c);textInput.value='';textInput.style.height='auto';pendingImage=null;fileInput.value='';renderPreview();render()}catch(e){alert(e.message)}finally{saveBtn.textContent='Pin it';updateSave()}});
filterRow.addEventListener('click',e=>{const b=e.target.closest('button[data-filter]');if(!b)return;currentFilter=b.dataset.filter;[...filterRow.children].forEach(x=>x.classList.toggle('active',x===b));render()});
function fmtDate(ts){return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'})}
function render(){const filtered=clips.filter(c=>currentFilter==='text'?!!c.text&&!c.image:currentFilter==='image'?!!c.image:true);board.innerHTML='';if(!filtered.length){emptyState.style.display='block';board.style.display='none';return}emptyState.style.display='none';board.style.display='';filtered.forEach(c=>{const card=document.createElement('div');card.className='clip';if(c.image){const i=document.createElement('img');i.src=c.image;i.alt=c.text||'Saved image';i.onclick=()=>{lightboxImg.src=c.image;lightbox.classList.add('open')};card.append(i)}if(c.text){const p=document.createElement('p');p.textContent=c.text;card.append(p)}const meta=document.createElement('div');meta.className='clip-meta';const d=document.createElement('span');d.textContent=fmtDate(c.created);const del=document.createElement('button');del.className='clip-del';del.textContent='Remove';del.onclick=async()=>{try{await api('/clips/'+encodeURIComponent(c.id),{method:'DELETE'});clips=clips.filter(x=>x.id!==c.id);render()}catch(e){alert(e.message)}};meta.append(d,del);card.append(meta);board.append(card)})}
async function loadClips(){try{clips=await api('/clips');render()}catch(e){console.error(e);showAuth()}}
lightbox.onclick=()=>lightbox.classList.remove('open');
api('/me').then(d=>d.loggedIn?showApp(d.username):showAuth()).catch(showAuth);
})();
</script>
</body>
</html>
